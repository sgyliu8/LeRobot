    <text x="523" y="276" text-anchor="middle" fill="#edf6fa" font-size="27" font-weight="700">本地工作台</text>
    <text x="523" y="308" text-anchor="middle" fill="#a8c0d1" font-size="19">LeLab + LeRobot</text>
