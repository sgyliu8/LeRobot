    <text x="50" y="611" fill="#8cdec5" font-size="23" font-weight="700">从示范中学习</text>
    <text x="277" y="611" fill="#c1d3df" font-size="23">记录 → 检查 → 训练 → 有人现场验证</text>
    <text x="1150" y="611" text-anchor="end" fill="#a8c0d1" font-size="19">数据默认留在本地</text>
