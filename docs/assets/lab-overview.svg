<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">PhysicalAI SO101 Lab：从你的一次示范开始</title>
  <desc id="desc">角色示意而非实物照片。操作者移动示教臂，电脑上的本地工作台把目标交给执行臂。腕部相机观察夹爪，桌面相机观察场景；两路画面和动作保存在本地，用于回看与学习。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d6e5ee" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#67d6b3" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="24" fill="#112536"/>
  <rect width="1200" height="660" rx="24" fill="url(#grid)"/>
