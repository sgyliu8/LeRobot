    <text x="60" y="282" fill="#a8c0d1" font-size="19">LEADER · 由你带着运动</text>
    <path d="M 61 494 H 330" stroke="#486477" stroke-width="2"/>
    <rect x="85" y="476" width="88" height="17" rx="5" fill="#d2dfe7"/>
