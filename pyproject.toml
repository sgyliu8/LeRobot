[project]
name = "physicalai-so101-lab"
version = "0.1.0"
description = "Local, upstream-first SO-ARM101 lab integration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "LeLab",
]

[dependency-groups]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["so101_lab*"]

[tool.uv.sources]
lelab = { path = "_vendor/lelab", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
